<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1EC"/>
      <stop offset="1" stop-color="#D7E5DB"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#4E6E58" opacity="0.10"/>
    </pattern>
    <g id="pouch">
      <rect x="-66" y="-105" width="132" height="210" rx="16" fill="currentColor"/>
      <path d="M30 -105 H50 A16 16 0 0 1 66 -89 V89 A16 16 0 0 1 50 105 H30 Z" fill="#26201D" opacity="0.10"/>
      <path d="M-66 -80 V-89 A16 16 0 0 1 -50 -105 H50 A16 16 0 0 1 66 -89 V-80 Z" fill="#FFFFFF" opacity="0.25"/>
      <line x1="-58" y1="-80" x2="58" y2="-80" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="2 6" opacity="0.55" stroke-linecap="round"/>
      <path d="M-34 -105 H-12 C-26 -40 -26 40 -12 105 H-34 C-48 40 -48 -40 -34 -105 Z" fill="#FFFFFF" opacity="0.10"/>
      <rect x="-42" y="-36" width="84" height="84" rx="14" fill="#FFFFFF" opacity="0.95"/>
      <path d="M0 -18 C8 -8 15 1 15 10 A15 15 0 1 1 -15 10 C-15 1 -8 -8 0 -18 Z" fill="currentColor" transform="translate(0 4)"/>
      <rect x="-46" y="84" width="92" height="7" rx="3.5" fill="#26201D" opacity="0.10"/>
    </g>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#dots)"/>
  <circle cx="400" cy="248" r="180" fill="#FFFFFF" opacity="0.5"/>

  <!-- Sombras -->
  <ellipse cx="296" cy="362" rx="66" ry="12" fill="#26201D" opacity="0.09"/>
  <ellipse cx="430" cy="382" rx="58" ry="11" fill="#26201D" opacity="0.09"/>
  <ellipse cx="544" cy="392" rx="62" ry="11" fill="#26201D" opacity="0.09"/>

  <!-- Sachet individual -->
  <use href="#pouch" transform="translate(296 250) rotate(-10) scale(0.82)" color="#4E6E58"/>

  <!-- Stick de azúcar -->
  <g transform="translate(430 250) rotate(16)">
    <rect x="-19" y="-112" width="38" height="224" rx="15" fill="#FFFFFF"/>
    <rect x="-19" y="-112" width="38" height="224" rx="15" fill="none" stroke="#26201D" opacity="0.08" stroke-width="2"/>
    <path d="M-19 -98 V-97 A15 15 0 0 1 -4 -112 H4 A15 15 0 0 1 19 -97 V-90 H-19 Z" fill="#E0A437"/>
