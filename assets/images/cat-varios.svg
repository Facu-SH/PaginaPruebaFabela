  </g>

  <!-- Saquito de infusión -->
  <g transform="translate(536 312) rotate(6)">
    <rect x="-54" y="-60" width="108" height="120" rx="12" fill="#FFFFFF"/>
    <rect x="-54" y="-60" width="108" height="120" rx="12" fill="none" stroke="#26201D" opacity="0.08" stroke-width="2"/>
    <path d="M-54 -60 L-18 -60 L-54 -24 Z" fill="#26201D" opacity="0.05"/>
    <path d="M0 30 C-16 14 -13 -6 6 -14 C 14 4 10 22 0 30 Z" fill="#4E6E58" opacity="0.9"/>
    <path d="M42 -60 C 58 -92 76 -100 92 -92" stroke="#4E6E58" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="84" y="-100" width="30" height="22" rx="6" fill="#4E6E58"/>
