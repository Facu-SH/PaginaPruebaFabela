<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ilustrativo — Reemplazar por una foto real de la categoría
     (ej. cat-condimentos.jpg) manteniendo el nombre o actualizando el src en index.html. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF3E2"/>
      <stop offset="1" stop-color="#F5E3BE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#B07A1B" opacity="0.10"/>
    </pattern>
    <!-- Sobre blanco de condimento: etiqueta con el color del atributo color del <use> -->
    <g id="packet">
      <rect x="-52" y="-92" width="104" height="184" rx="14" fill="#FFFFFF"/>
      <rect x="-52" y="-92" width="104" height="184" rx="14" fill="none" stroke="#26201D" opacity="0.08" stroke-width="2"/>
      <path d="M-52 -70 V-78 A14 14 0 0 1 -38 -92 H38 A14 14 0 0 1 52 -78 V-70 Z" fill="#26201D" opacity="0.10"/>
      <line x1="-44" y1="-70" x2="44" y2="-70" stroke="#26201D" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.22" stroke-linecap="round"/>
      <rect x="-32" y="-28" width="64" height="64" rx="10" fill="currentColor"/>
      <circle cx="-12" cy="-4" r="4" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="8" cy="10" r="4" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="12" cy="-12" r="4" fill="#FFFFFF" opacity="0.85"/>
      <rect x="-36" y="72" width="72" height="6" rx="3" fill="#26201D" opacity="0.10"/>
    </g>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#dots)"/>
  <circle cx="400" cy="248" r="180" fill="#FFFFFF" opacity="0.5"/>

  <!-- Sombras -->
  <ellipse cx="335" cy="372" rx="80" ry="13" fill="#26201D" opacity="0.10"/>
  <ellipse cx="462" cy="380" rx="80" ry="13" fill="#26201D" opacity="0.10"/>

  <!-- Pimienta y sal -->
  <use href="#packet" transform="translate(338 254) rotate(-8)" color="#3E342E"/>
  <use href="#packet" transform="translate(462 260) rotate(8)" color="#E0A437"/>

  <!-- Granos sueltos -->
  <circle cx="252" cy="356" r="5" fill="#3E342E" opacity="0.5"/>
  <circle cx="272" cy="372" r="4" fill="#E0A437" opacity="0.7"/>
  <circle cx="548" cy="362" r="5" fill="#E0A437" opacity="0.7"/>
  <circle cx="566" cy="344" r="4" fill="#3E342E" opacity="0.45"/>
  <circle cx="540" cy="166" r="5" fill="#E0A437" opacity="0.55"/>
  <circle cx="246" cy="178" r="4" fill="#3E342E" opacity="0.4"/>
</svg>
